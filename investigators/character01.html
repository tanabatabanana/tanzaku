    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../character.css">

    <script>
        // ホームから探索者の写真を押して来た時は、波が画面をおおった状態から始める（ちらつき防止）
        try { if (sessionStorage.getItem("charFly")) document.documentElement.classList.add("arriving"); } catch (e) {}
    </script>
    <script>
        // 別のページから青い円で移動してきた時は、画面を青でおおった状態から始める（ちらつき防止）
        try { if (sessionStorage.getItem("rippleFrom")) document.documentElement.classList.add("ripple-in"); } catch (e) {}
    </script>
</head>

<!--
    このページのひな形：キャラクターを変える時は、body の data- の4つを書き換える
    data-character … 名前（data/investigators.json の name と同じ）
    data-tatie     … 立ち絵（t-○○.png）    data-faces … 顔アップの差分のフォルダ    data-photo … 履歴書の写真（k-○○.png）
    data-display   … ディスプレイ（d-○○.png）
    顔アップのファイル名が自動で見つからない時は、data-face-files="名前1.png,名前2.png,…" を足すと、その順に表示される
-->

<h1 class="sr-only">小猫</h1>

<div class="char-layout">

    <!-- 左：立ち絵のまわり（スクロールしても、その場に残る） -->
    <section class="char-left">
        <div class="stage" id="stage">
            <div class="stage-name" id="stage-name" aria-hidden="true">小猫</div>
            <button type="button" class="stage-tachie" id="tachie" aria-label="立ち絵をタップすると、ひとこと話す">
                <img id="tachie-img" alt="小猫の立ち絵">
            </button>
            <svg class="stage-floor" id="stage-floor" aria-hidden="true"></svg>
            <div class="stage-speech" id="speech" role="status" hidden></div>
        </div>
    </section>

    <!-- 右：ウィンドウ達（スクロールする） -->
    <section class="char-right" id="char-right">

        <!-- 後ろの、ぼかしたウィンドウ（character.js が作る） -->
        <div class="back-windows" id="back-windows" aria-hidden="true"></div>

        <div class="char-windows">

            <!-- A：履歴書 -->
            <article class="char-win win-resume" aria-label="プロフィール">

                <div class="resume-head">
                    <h3 class="resume-title">履歴書</h3>
                    <span class="resume-date" id="r-date"></span>
                </div>

                <div class="resume">
                    <div class="r-field r-yomi"><span>ふりがな</span><b id="r-yomi"></b></div>
                    <div class="r-field r-name"><span>氏　名</span><b id="r-name"></b></div>

                    <!-- 性別：氏名の右・写真の左。「男・女」のうち、当てはまる方に丸 -->
                    <div class="r-gender"><b id="r-gender"></b></div>

                    <!-- 年齢・身長：氏名の下 -->
                    <div class="r-agehei">
                        <div class="r-field"><span>年齢</span><b id="r-age"></b></div>
                        <div class="r-field"><span>身長</span><b id="r-height"></b></div>
                    </div>

                    <div class="resume-photo" id="resume-photo">
                        <div class="rp-inner"><img id="resume-img" alt="小猫の写真"></div>
                        <i class="tape"></i>
                    </div>

                    <div class="r-field r-stats"><span>能力値</span><div class="r-statgrid" id="r-statgrid"></div></div>
                    <div class="r-field r-birth"><span>出身シナリオ</span><b id="r-birth"></b></div>

                    <!-- 通過済みシナリオ：学歴・職歴の欄と同じ罫線の表 -->
                    <div class="r-go">
                        <div class="go-head"><span>No.</span><span>通過済みシナリオ</span></div>
                        <ol id="r-go"></ol>
                    </div>
                </div>

            </article>


                <!-- B：能力値のチャート（履歴書とは別の窓） -->
                <aside class="char-win win-radar" aria-label="能力値のチャート">
                    <svg id="radar" viewBox="-110 -105 220 210" role="img" aria-label="STRからINTまでの能力値のレーダーチャート"></svg>
                </aside>


            <!-- 顔アップ：音楽プレイヤー風 -->
            <aside class="char-win win-player" aria-label="顔アップの差分">
                <div class="player-face">
                    <img id="face-img" alt="表情の差分">
                    <span class="face-count" id="face-count"></span>
                    <span class="face-empty" id="face-empty" hidden></span>
                </div>
                <div class="player-panel">
                    <div class="player-bar"><i id="face-progress"></i></div>
                    <div class="player-ctrl">
                        <button type="button" id="pl-first" aria-label="最初の表情">|◀</button>
                        <button type="button" id="pl-prev" aria-label="前の表情">◀◀</button>
                        <button type="button" id="pl-play" aria-label="自動で切り替える" aria-pressed="false">▶</button>
                        <button type="button" id="pl-next" aria-label="次の表情">▶▶</button>
                        <button type="button" id="pl-last" aria-label="最後の表情">▶|</button>
                    </div>
                </div>
            </aside>

            <!-- ディスプレイ -->
            <aside class="char-win win-display" aria-label="ディスプレイ">
                <img id="display-img" alt="小猫のディスプレイ">
            </aside>

            <!-- 説明（見えた瞬間にタイピングされる。窓の大きさは全文に合わせて最初から固定） -->
            <article class="char-win win-info" id="win-info" aria-label="キャラクターの説明">
                <div class="info-body"><span class="info-ghost" id="info-ghost" aria-hidden="true"></span><span id="info-text"></span></div>
            </article>

        </div>
    </section>

</div>

<!-- ページの下部の波：ウィンドウ達は、この中から現れる -->
<div class="char-waves" aria-hidden="true">
    <i class="w1"></i><i class="w2"></i><i class="w3"></i>
    <div class="char-water"></div>
</div>

<!-- ページの一番上に戻るボタン（ドットの矢印） -->
<button type="button" class="to-top" id="to-top" aria-label="ページの一番上に戻る"></button>
